version: '3.8'

services:
  api:
    build: .
    ports:
      - "7860:7860"
    volumes:
      - ./checkpoints:/app/checkpoints:ro
      - ./logs:/app/logs
    environment:
      - TRANSFORMERS_OFFLINE=1
      - CHECKPOINT_PATH=checkpoints/checkpoint_epoch_4.pt
      - WANDB_API_KEY=${WANDB_API_KEY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
